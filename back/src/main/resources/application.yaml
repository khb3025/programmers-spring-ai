spring:
  application:
    name: Back
  config:
    import: optional:file:.env[.properties]

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/${DATABASE_NAME:faqdb}
    username: ${DATABASE_USERNAME:faq}
    password: ${DATABASE_PASSWORD:faq123}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

  sql:
    init:
      mode: always # 내장 DB가 아니어도 항상 스키마 파일 실행
      schema-locations: classpath:schema/faq-schema.sql

